<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="old.css">
<style>
  html,body{margin:0;background:#fff;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#111;}
  .wrap{padding:14px;}
</style>
</head><body>
<div class="wrap">
  <div class="ds_benefit">
    <div class="ds_benefit_max">
      <strong class="title" style="color:#111;">최대 혜택가</strong>
      <strong class="price" style="color:#ff0000;"><span class="value">17,800</span><span class="unit">원</span></strong>
    </div>
    <div class="ds_benefit_list">
      <div class="item member" style="background-color:rgb(14 46 114);">
        <div class="item_title">
          <div class="title"><img src="img/ico_price1.png" alt="회원가"><span style="color:#fff;">회원가</span></div>
          <div class="coupon"><strong class="price" style="color:#fff;"><span class="value">2,000</span><span class="unit">원</span><span class="text">쿠폰</span></strong></div>
        </div>
        <div class="item_price"><strong class="price" style="color:#fff;"><span class="value">35,900</span><span class="unit">원</span></strong></div>
      </div>
      <div class="item friend" style="background-color:rgb(254 221 44);">
        <div class="item_title">
          <div class="title"><img src="img/ico_price2.webp" alt="플친가"><span style="color:#222;">플친가</span></div>
          <div class="coupon"><strong class="price" style="color:#222;"><span class="value">20,100</span><span class="unit">원</span><span class="text">쿠폰</span></strong></div>
        </div>
        <div class="item_price"><strong class="price" style="color:#222;"><span class="value">17,800</span><span class="unit">원</span></strong></div>
      </div>
    </div>
  </div>
</div>
</body></html>
